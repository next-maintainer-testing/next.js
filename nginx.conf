worker_processes 1;
daemon off;
error_log stderr notice;
pid logs/nginx.pid;

events { worker_connections 4096; }

http {
  access_log off;
  client_body_temp_path logs/client_body;
  proxy_temp_path logs/proxy;
  fastcgi_temp_path logs/fastcgi;
  uwsgi_temp_path logs/uwsgi;
  scgi_temp_path logs/scgi;

  server {
    listen 127.0.0.1:3101;
    server_name _;

    location / {
      proxy_pass http://127.0.0.1:3100;
    }

    location /not_found {
      return 404 "The requested resource was not found";
    }

    proxy_intercept_errors on;
    error_page 404 /not_found;
  }
}
