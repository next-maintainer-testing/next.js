name: Issue reopen E2E probes

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic boundary or bot event to probe
        required: true
        type: choice
        options:
          - expired-request
          - boundary-request
          - bot-request
          - legacy-bot-request
          - bot-closure
      issue-number:
        description: Controlled fixture issue number
        required: true
        type: string

permissions: {}

jobs:
  probe:
    if: github.repository == 'next-maintainer-testing/next.js'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout issue reopen action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/issue-reopen

      - name: Run controlled probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          REPOSITORY: ${{ github.repository }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail

          event_path="$RUNNER_TEMP/issue-reopen-event.json"
          issue=$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER")

          case "$SCENARIO" in
            expired-request | boundary-request)
              closed_at=$(jq -r '.closed_at' <<<"$issue")
              if [[ "$SCENARIO" == 'expired-request' ]]; then
                offset=1209600001
              else
                offset=1209600000
              fi
              created_at=$(node -e \
                'console.log(new Date(Date.parse(process.argv[1]) + Number(process.argv[2])).toISOString())' \
                "$closed_at" "$offset")
              requester=$(jq '.user' <<<"$issue")
              jq -n \
                --arg body='Reopen: Synthetic timestamp boundary probe.' \
                --arg created_at "$created_at" \
                --argjson issue "$issue" \
                --argjson requester "$requester" \
                '{issue: $issue, comment: {body: $body, created_at: $created_at, user: $requester}}' \
                >"$event_path"
              event_name=issue_comment
              ;;
            bot-request)
              jq -n \
                --argjson issue "$issue" \
                '{issue: $issue, comment: {body: "Reopen: Bot request probe.", created_at: $issue.closed_at, user: {id: 1, login: "probe[bot]", type: "Bot"}}}' \
                >"$event_path"
              event_name=issue_comment
              ;;
            legacy-bot-request)
              jq -n \
                --argjson issue "$issue" \
                '{issue: $issue, comment: {body: "Reopen: Legacy bot request probe.", created_at: $issue.closed_at, user: {id: 2, login: "probe-bot", type: "User"}}}' \
                >"$event_path"
              event_name=issue_comment
              ;;
            bot-closure)
              jq -n \
                --argjson issue "$issue" \
                '{issue: $issue, sender: $issue.closed_by}' \
                >"$event_path"
              event_name=issues
              ;;
          esac

          env \
            GITHUB_EVENT_NAME="$event_name" \
            GITHUB_EVENT_PATH="$event_path" \
            GITHUB_REPOSITORY="$REPOSITORY" \
            GITHUB_TOKEN="$GH_TOKEN" \
            node .github/actions/issue-reopen/index.js
